# ==============================================================================
# Stack: Project Fade to Black - Motor Gráfico e IA Heurística 2D
# Ambiente: Linux / Debian (VM Docker gerenciada via Portainer)
# Descrição: Aplicação desktop Java 17 / JavaFX encapsulada em contêiner com
#            servidor gráfico virtual (Xvfb) e transmissão em tempo real via
#            WebSockets (noVNC), projetada para disponibilização via NGINX UI.
# ==============================================================================
#
# ── Lista de Variáveis de Ambiente (.env ou Portainer -> Advanced mode) ────────
# Copie o bloco puro abaixo (sem comentários na mesma linha) para o arquivo '.env'
# ao lado deste docker-compose.yml ou em Portainer -> Environment variables -> Advanced:
#
# HOST_IP=10.100.2.101
# HOST_PORT=18088
# APP_VOLUME=/srv/stacks/fade-to-black
# DISPLAY_WIDTH=1600
# DISPLAY_HEIGHT=1200
# TZ=America/Bahia
#
# Descrição rápida das variáveis (todas opcionais, pois possuem padrão via ':-'):
#   • HOST_IP        -> IP do servidor Docker vinculado à porta (0.0.0.0 p/ todas interfaces).
#   • HOST_PORT      -> Porta TCP publicada no host e apontada no Proxy Reverso (NGINX UI).
#   • APP_VOLUME     -> Caminho físico da stack no host (usado no build e em ./screenshots).
#   • DISPLAY_WIDTH  -> Largura virtual do Xvfb em px (padrão HiDPI 2x: 1600).
#   • DISPLAY_HEIGHT -> Altura virtual do Xvfb em px (padrão HiDPI 2x: 1200).
#   • TZ             -> Fuso horário interno do contêiner para logs e screenshots.
# ==============================================================================

services:
  fade-to-black-game:
    # ── 1. Construção, Imagem e Ciclo de Vida ──────────────────────────────────

    # Instrui o Docker Compose a compilar a imagem automaticamente a partir do
    # Dockerfile presente no diretório especificado pela variável 'APP_VOLUME'.
    # REQUISITO PARA PORTAINER WEB EDITOR: O contêiner do próprio Portainer
    # deve possuir o volume '/srv/stacks:/srv/stacks' montado para conseguir ler
    # o Dockerfile e enviar o contexto de build ao Docker Daemon.
    build:
      # Define o diretório raiz do código-fonte no servidor via 'APP_VOLUME'
      # (padrão: /srv/stacks/fade-to-black) como contexto de build.
      context: ${APP_VOLUME:-/srv/stacks/fade-to-black}
      # Especifica o arquivo de definição das etapas de compilação e execução.
      dockerfile: Dockerfile

    # Tag local atribuída à imagem resultante do processo de compilação.
    image: fade-to-black-game:latest

    # Identificador textual fixo para gerenciamento no painel do Portainer e
    # inspeção direta via CLI ('docker ps' / 'docker logs').
    container_name: fade-to-black-game

    # Política de reinicialização contínua: reergue o serviço automaticamente após
    # falhas inesperadas ou reinicialização do servidor host, exceto em parada manual.
    restart: unless-stopped

    # ── 2. Exposição de Rede e Integração com Proxy Reverso ──────────────────
    ports:
      # Formato [IP_do_Host]:[Porta_do_Host]:[Porta_Contêiner]
      # Publica a interface HTTP/WebSocket do noVNC (porta interna 8080) usando
      # as variáveis 'HOST_IP' e 'HOST_PORT' definidas no painel do Portainer.
      # Caso não sejam declaradas, assume o IP privado 10.100.2.101 e a porta 18088.
      # NOTA DE SEGURANÇA: O vínculo explícito ao IP privado do host Docker restringe
      # a escuta à rede interna, impedindo acessos externos diretos fora do NGINX UI.
      - "${HOST_IP:-10.100.2.101}:${HOST_PORT:-18088}:8080"

    # ── 3. Variáveis de Ambiente e Parâmetros Gráficos ────────────────────────
    # Formato das Resoluções Abaixo -> DISPLAY_WIDTH (Largura) x DISPLAY_HEIGHT (Altura):
    #   • Primeiro número (antes do 'x') = DISPLAY_WIDTH  (Largura horizontal em px)
    #   • Segundo número (depois do 'x') = DISPLAY_HEIGHT (Altura vertical em px)
    #   Exemplo para 1600 x 1200 -> DISPLAY_WIDTH=1600 e DISPLAY_HEIGHT=1200.
    #
    # Resoluções Suportadas (Proporção Lógica Nativa 4:3 -> 800x600 px):
    # O entrypoint.sh calcula automaticamente o fator vetorial de escala HiDPI
    # mediante a fórmula: RENDER_SCALE = max(1.0, min(DISPLAY_WIDTH / 800, DISPLAY_HEIGHT / 600)),
    # preservando as proporções exatas da grade 20x15 sem distorção de sprites.
    #
    #  Resoluções 4:3 Recomendadas [WIDTH x HEIGHT] (preenchem 100% da janela noVNC):
    #   • 800  x 600  (Escala 1.00x) -> Mínima suportada / leve para conexões lentas
    #   • 1024 x 768  (Escala 1.28x) -> Intermediária compacta
    #   • 1200 x 900  (Escala 1.50x) -> Equilibrada para telas HD / notebooks
    #   • 1600 x 1200 (Escala 2.00x) -> PADRÃO RECOMENDADO (HiDPI 2x nítido em Full HD)
    #   • 2000 x 1500 (Escala 2.50x) -> Alta definição para monitores QHD
    #   • 2400 x 1800 (Escala 3.00x) -> HiDPI 3x (maior uso de CPU e banda noVNC)
    #   • 3200 x 2400 (Escala 4.00x) -> Ultra HiDPI 4x (renderização por software pesada)
    #
    #  Notas de Compatibilidade:
    #   • Widescreen (ex: 1280x720 -> 1.20x = 960x720; 1920x1080 -> 1.80x = 1440x1080):
    #     funciona sem esticar os gráficos (a janela mantém 4:3, sobrando faixa lateral
    #     escura no Xvfb; prefira 1600x1200 para maior nitidez nativa em 2.00x).
    #   • Abaixo de 800x600 (ex: 640x480): NÃO suportado — a JVM fixa o mínimo em
    #     1.00x (800x600), resultando em corte parcial da área visível do jogo.
    environment:
      # Largura horizontal do framebuffer virtual Xvfb em pixels (padrão HiDPI 2x: 1600 px).
      - DISPLAY_WIDTH=${DISPLAY_WIDTH:-1600}
      # Altura vertical do framebuffer virtual Xvfb em pixels (padrão HiDPI 2x: 1200 px).
      - DISPLAY_HEIGHT=${DISPLAY_HEIGHT:-1200}
      # Padroniza o fuso horário do sistema operacional interno do contêiner para
      # assegurar precisão temporal nos registros de execução e capturas de tela.
      - TZ=${TZ:-America/Bahia}

    # ── 4. Persistência de Dados (Capturas de Tela) ───────────────────────────
    volumes:
      # Mapeia o diretório onde o jogo grava capturas de tela (tecla F12) para a
      # subpasta correspondente à variável 'APP_VOLUME' informada no Portainer.
      # Evita caminhos fixos no arquivo Compose e preserva os arquivos PNG mesmo
      # após recriações, atualizações de imagem ou reinicializações do contêiner.
      - "${APP_VOLUME:-/srv/stacks/fade-to-black}/screenshots:/app/docs/screenshots"

    # ── 5. Monitoramento Ativo de Saúde (Healthcheck) ─────────────────────────
    healthcheck:
      # Verifica simultaneamente se o display virtual (Xvfb), a aplicação JVM
      # (fade-to-black.jar) e o servidor HTTP/WebSocket do noVNC (porta 8080) estão ativos.
      # O padrão '[j]ar' evita que o próprio comando 'pgrep' corresponda a si mesmo.
      test: [ "CMD-SHELL", "pgrep -x Xvfb >/dev/null && pgrep -f '[j]ar /app/fade-to-black.jar' >/dev/null && python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/\", timeout=2)' >/dev/null 2>&1" ]
      # Intervalo regular entre cada verificação periódica de integridade.
      interval: 15s
      # Tempo máximo de espera pela resposta antes de computar falha na checagem.
      timeout: 5s
      # Número de falhas consecutivas necessárias para declarar estado 'unhealthy'.
      retries: 3
      # Período inicial de carência durante o boot para carregamento do X11 e da JVM.
      start_period: 20s

    # ── 6. Controle e Rotação de Armazenamento de Logs ────────────────────────
    logging:
      # Utiliza o driver padrão JSON do Docker para armazenamento estruturado de logs.
      driver: "json-file"
      options:
        # Limita o tamanho máximo de cada arquivo de log a 10 Megabytes, prevenindo
        # o esgotamento gradual do armazenamento em disco da máquina virtual.
        max-size: "10m"
        # Mantém no máximo 3 arquivos arquivados no histórico de rotação.
        max-file: "3"
    # ── 7. Isolamento de Rede (Opcional para Proxy no Mesmo Host Docker) ──────
    # Caso o NGINX UI esteja em execução no mesmo servidor Docker através de uma
    # rede virtual compartilhada, descomente o bloco abaixo para habilitar tráfego
    # interno pelo nome do serviço ('http://fade-to-black-game:8080'), podendo então
    # remover a publicação direta da seção 'ports' acima.
    # networks:
    #   - proxy-network

    # ── Declaração de Infraestrutura de Rede Externa ──────────────────────────────
    # networks:
    #   proxy-network:
    #     # Sinaliza ao Compose que a rede virtual foi criada previamente por outra stack.
    #     external: true
